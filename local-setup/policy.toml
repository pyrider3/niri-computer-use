# 当前部署选择允许启动所有程序；仍使用租约、焦点核对和停止键。
unrestricted = true

[[preset]]
name = "wechat"
argv = ["/usr/bin/gtk-launch", "com.tencent.wechat"]
app_id = "wechat"

